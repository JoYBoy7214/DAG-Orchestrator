version: '3.8'

services:
  nats:
    image: nats:alpine  
    command: ["-js", "-DV", "-m", "8222", "-sd", "/data"] 
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - ./nats-data:/data 
    networks:             
      - ai_pipeline

  postgresDB:
    image: postgres:15-alpine
    env_file:
      - postgres_DB.env
    ports:
      - "5432:5432"
    volumes:
      - postgres_Db:/var/lib/postgresql/data
    networks:
      - ai_pipeline 

  worker:
    build:
      context: ../orchestrator/internal/sub
      dockerfile: Dockerfile.sub
    networks:
      - ai_pipeline 
    
volumes:
  postgres_Db:             

networks:                
  ai_pipeline:
    driver: bridge